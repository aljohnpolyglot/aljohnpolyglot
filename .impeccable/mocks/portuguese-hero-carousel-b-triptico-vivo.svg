  <text x="975" y="190" font-family="Arial" font-size="18" fill="#56655e"><tspan x="975">A língua saiu do estudo e entrou na conversa.</tspan><tspan x="975" dy="34">Nas Filipinas, o português passou a ter rostos</tspan><tspan x="975" dy="28">e histórias. Brasileiros e angolanos ampliaram</tspan><tspan x="975" dy="28">aquilo que eu entendia como mundo lusófono.</tspan></text>
