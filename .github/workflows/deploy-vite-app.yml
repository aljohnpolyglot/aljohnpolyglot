# .github/workflows/deploy-vite-app.yml
name: Build and Deploy Polyglot Connect (Vite) to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'polyglot_connect/**'
      - 'vite.config.js' # If this config is only for polyglot_connect
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-vite-app.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies ⚙️
        run: npm ci

      - name: Create .env file for Polyglot Connect (Vite build) 🔑
        # This .env file needs to be where Vite expects it based on its 'root' config.
        # Since vite.config.js has root: 'polyglot_connect', Vite will look for
        # .env in the 'polyglot_connect' directory.
        working-directory: ./polyglot_connect 
        run: |
          echo "Creating .env file in ./polyglot_connect/ for Vite build..."
          echo "VITE_GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "VITE_GEMINI_API_KEY_ALT=${{ secrets.GEMINI_API_KEY_ALT }}" >> .env
          echo "VITE_GEMINI_API_KEY_ALT_2=${{ secrets.GEMINI_API_KEY_ALT_2 }}" >> .env
          echo "VITE_GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "VITE_TOGETHER_API_KEY=${{ secrets.TOGETHER_API_KEY }}" >> .env
          echo ".env file created."

      - name: Build Polyglot Connect app with Vite 🛠️
        run: npm run build # Vite will use vite.config.js. Output to D:\website\dist_polyglot_app (locally)
                          # In Actions, it will be <workspace>/dist_polyglot_app

      - name: Verify Build Output (Debugging) 🔍
        run: |
          echo "Listing contents of ./dist_polyglot_app/ directory (Vite build output):"
          ls -R ./dist_polyglot_app

      - name: Deploy Polyglot Connect app to gh-pages branch 🚀
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # publish_dir is relative to the workspace root
          publish_dir: ./dist_polyglot_app 
          # Deploy the contents of 'dist_polyglot_app' into a 'polyglot_connect' folder on gh-pages
          destination_dir: polyglot_connect 
          force_orphan: true 
          keep_files: false